[workspace]
resolver = "2"
members = [
    ".",
    "../symflow-cli",
    "../../packages/symflow-core",
    "../../packages/symflow-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# --- async runtime ---
tokio        = { version = "1",    features = ["full"] }
async-trait  = "0.1"
# --- serde / DSL ---
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
# --- loi & log ---
thiserror    = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- tien ich ---
uuid         = { version = "1",    features = ["v4", "serde"] }
chrono       = { version = "0.4",  features = ["serde"] }
regex        = "1"
once_cell    = "1"
# --- do thi DAG ---
petgraph     = "0.6"
# --- HTTP client (LLM + scraper) ---
reqwest      = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
scraper      = "0.20"
# --- PDF ---
lopdf        = "0.34"
# --- CSDL ---
sqlx = { version = "0.8", features = [
    "runtime-tokio", "tls-rustls",
    "postgres", "mysql",
    "uuid", "chrono", "json", "migrate",
] }
# --- web server ---
axum         = { version = "0.7",  features = ["ws"] }
tower-http   = { version = "0.6",  features = ["cors", "trace"] }
# --- CLI ---
clap         = { version = "4",    features = ["derive"] }
# --- config ---
dotenvy      = "0.15"

# crate noi bo (path)
symflow-core  = { path = "../../packages/symflow-core" }
symflow-store = { path = "../../packages/symflow-store" }

[package]
name = "symflow-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "symflow-api"
path = "src/main.rs"

[dependencies]
symflow-core = { workspace = true }
symflow-store = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
futures-util = "0.3"
argon2 = "0.5"
axum-extra = { version = "0.9", features = ["cookie"] }
async-trait = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
time = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
